<div class="dialog">
  <h3> {{ message.title }} </h3>
  <div>
    {{ message.msg }}
  </div>
</div>
<div mat-dialog-actions>
  <button mat-raised-button color="primary" [mat-dialog-close]="true">Si</button>
  <button mat-raised-button color="warn" mat-dialog-close (click)="onNoClick()">No</button>
</div>
