<div class="main">
  <div class="container">
    <a class="btn-volver" mat-raised-button color="primary" routerLink="/admin"><fa-icon [icon]="faArrowLeft"></fa-icon> Volver</a>
    <h1 class="titulo">Mesas</h1>
  </div>
  <div class="tabla">
    <pa-tabla
      class="tabla-pc"
      [tableData]="datosTabla" 
      [tableColumns]="columnasPC" 
      [isPaginator]="false"
      (editAction)="onEdit($event)"
      (deleteAction)="onDelete($event)"
      [confirmDialogMsg]="msgConfirmacion"
    ></pa-tabla>
    <pa-tabla
      class="tabla-celu" 
      [tableData]="datosTabla" 
      [tableColumns]="columnasCelu" 
      [isPaginator]="false"
      (editAction)="onEdit($event)"
      (deleteAction)="onDelete($event)"
      [confirmDialogMsg]="msgConfirmacion"
    ></pa-tabla>
  </div>
  
  <div class="boton">
    <button class="submit" type="submit" mat-raised-button color="primary" (click)="onAdd()">
      Agregar mesa (+)
    </button>
  </div>
</div>
