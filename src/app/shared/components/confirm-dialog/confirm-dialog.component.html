<div class="main">
  <div class="dialog">
    <h2>{{ message.title }}</h2>
    <div>{{ message.msg }}</div>
  </div>
  <div class="dialog-botones" mat-dialog-actions>
    <button class="dialog-btn dialog-btn--secondary" mat-flat-button color="warn" mat-dialog-close (click)="onNoClick()">No</button>
    <button class="dialog-btn" mat-flat-button color="primary" [mat-dialog-close]="true">Si</button>
  </div>
</div>
