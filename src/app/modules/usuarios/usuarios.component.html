<mat-sidenav-container class="usuario-container">
    <mat-sidenav class="barra" mode=side [opened]="mostrarBarra">
        <mat-nav-list role="navigation" class="opciones">
               <a class="opcion-perfil" mat-list-item routerLinkActive="seleccionado" routerLink="/perfil/info"><mat-icon>settings</mat-icon>Información de mi cuenta</a>               
               <a class="opcion-perfil" mat-list-item routerLinkActive="seleccionado" routerLink="/perfil/reservas"><mat-icon>calendar_month</mat-icon>Histórico de reservas</a>               
               <a class="opcion-perfil" mat-list-item routerLinkActive="seleccionado" routerLink="/perfil/resumenes"><mat-icon>feed</mat-icon>Histórico de resúmenes</a>               
               <a class="opcion-perfil" mat-list-item routerLinkActive="seleccionado" routerLink="/perfil/menus"><mat-icon>restaurant_menu</mat-icon>Mis menús</a>               
               <a class="opcion-perfil" mat-list-item routerLinkActive="seleccionado" routerLink="/perfil/pedidos"><mat-icon>shopping_cart</mat-icon>Mis pedidos vigentes</a>               
            
            <mat-divider></mat-divider>
        <div class="logout">
            <a mat-list-item (click)="logout()"> 
                <mat-icon>logout</mat-icon> 
                Cerrar sesión
            </a>               
        </div>

        </mat-nav-list>

    </mat-sidenav>
    <mat-sidenav-content class="contenido">
        <button mat-raised-button class="button-celular" (click)="desplegarBarra()">
            <mat-icon>menu_open</mat-icon>{{mostrarBarra? 'Ocultar' : 'Mostrar'}} menú
        </button>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
